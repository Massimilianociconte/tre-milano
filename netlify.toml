# Configurazione intenzionalmente fail-closed per la preview temporanea.
# Anche un deploy sul primary URL Netlify resta fixture + noindex finché le
# variabili Netlify non richiedono esplicitamente il go-live Gold.
[build]
  # I default restano preview/fixture, ma un cutover esplicito nelle Environment
  # Variables di Netlify non richiede una modifica al repository. I gate Astro
  # bloccano comunque production/gold se catalogo o dominio non sono idonei.
  command = "node scripts/run-netlify-build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.9.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "pnpm run dev"
  targetPort = 4321
  port = 8888
  autoLaunch = false

# Il deploy manuale della preview pubblica la Function anche sul percorso
# tecnico `/.netlify/functions/*`. Il proxy esplicito rende stabile il
# contratto applicativo e lascia alla Function il controllo del solo metodo POST.
[[redirects]]
  from = "/api/search/interpret"
  to = "/.netlify/functions/interpret-search"
  status = 200
  force = true
  [redirects.rate_limit]
    action = "rate_limit"
    window_limit = 12
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Gli header di sicurezza restano in ogni contesto. X-Robots-Tag viene invece
# generato in `dist/_headers`: globale in preview/fixture, assente soltanto dopo
# che il build gate production/gold ha validato catalogo e dominio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"
    # La Content-Security-Policy è generata a build-time in dist/_headers da
    # scripts/generate-netlify-headers.mjs: script-src senza 'unsafe-inline',
    # con i soli hash sha256 degli inline realmente emessi dalla build.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
